[project]
name = "xair-scene-manager"
dynamic = ["version"]
description = "Copy, export, and import Behringer X-Air mixer scenes between mixer snapshot slots and local .scn files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
xair-scene-manager = "xair_scene_manager.cli:main"

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xair_scene_manager*"]

[tool.setuptools_scm]
